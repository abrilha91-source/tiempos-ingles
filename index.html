<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiempos en Inglés</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#1d3d6e"><link rel="apple-touch-icon" href="icon.svg">
<style>
@font-face{font-family:'Noto Sans';src:url(fonts/NotoSans-Regular.ttf);font-weight:400}@font-face{font-family:'Noto Sans';src:url(fonts/NotoSans-Bold.ttf);font-weight:700}
:root{--p:#1d3d6e;--a:#f2b33d;--g:#2e8b57;--r:#c0392b;--bg:#f3f5fa;--m:#5f6b7a}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans',sans-serif;background:var(--bg);color:#1b2330;font-size:16px;padding-bottom:84px}
header{background:var(--p);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:18px}header small{opacity:.85}
main{max-width:720px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px #0002}
h2{font-size:17px;margin:0 0 8px;color:var(--p)}h3{font-size:15px;margin:10px 0 6px}
button,select,input{font:inherit}button{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 14px;margin:3px 2px;cursor:pointer}
button.s{background:#e2e8f3;color:var(--p)}button.ok{background:var(--g)}button.no{background:var(--r)}button:disabled{opacity:.45}
input,select{width:100%;padding:10px;border:1px solid #c9d1de;border-radius:9px;margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #dde;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--m);margin:0;border-radius:0;padding:8px 2px;font-size:12px}nav button.on{color:var(--p);font-weight:700}nav b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0;text-align:left;min-height:64px}
.f{font-family:monospace,'Noto Sans';background:#f6f0dd;border-radius:8px;padding:6px 8px;margin:3px 0;font-size:14px}
.tile{display:inline-block;background:#e2e8f3;color:var(--p);padding:8px 10px;margin:3px;border-radius:8px;font-weight:700}
.ans{min-height:52px;border:2px dashed #c9d1de;border-radius:10px;padding:4px;margin:8px 0}
.big{font-size:19px;font-weight:700;margin:8px 0}.m{color:var(--m);font-size:14px}.okc{color:var(--g)}.noc{color:var(--r)}
.bar{height:10px;background:#e2e8f3;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.w{display:inline-block;padding:2px 5px;margin:2px;border-radius:6px}.w.ok{background:#d8f0e2}.w.no{background:#f8d7d3}
.pill{display:inline-block;background:var(--a);color:#222;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #eee;padding:5px;text-align:left}
.opts button.ok,.opts button.good{background:var(--g)!important;color:#fff!important}.opts button.no{background:var(--r)!important;color:#fff!important}.opts button{display:block;width:100%;text-align:left;background:#fff;color:#1b2330;border:1px solid #c9d1de}
</style></head><body>
<header><div><h1>Tiempos en Inglés</h1><small id="hs"></small></div><span class="pill" id="hx"></span></header>
<main id="v"></main>
<nav><button data-t="inicio"><b>🏠</b>Inicio</button><button data-t="formulas"><b>📘</b>Fórmulas</button><button data-t="jugar"><b>🎮</b>Practicar</button><button data-t="pron"><b>🗣️</b>Pronunciar</button><button data-t="prog"><b>📈</b>Progreso</button></nav>
<script src="app.js"></script></body></html>
